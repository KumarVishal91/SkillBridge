<style>

:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

<body>
<nav aria-label="Main">
  <span class="logo"><b>⇄</b> SkillBridge</span>
  <button class="tab" data-act="tab" data-v="matches">Matches</button>
  <button class="tab" data-act="tab" data-v="profile">My profile</button>
  <button class="tab" data-act="tab" data-v="chat">Chat</button>
  <span class="sp"></span>
  <button class="btn g s" data-act="theme">Light mode</button>
</nav>
<main id="app"></main>

<script>
const KEY = 'skillbridge_html_demo_v1';
const LV = { beginner: 1, intermediate: 2, advanced: 3 };
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'], SLOTS = ['Morning','Afternoon','Evening'], SLOT_HOURS = 2;
const QUICK = ['Guitar','Python','React','Spanish','Cooking','Photography','Yoga','Excel'];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).trim().toLowerCase();
const T = (s, l) => ({ s, l });

function fresh() {
  return { tab: 'matches', chat: null, chats: {}, myRatings: {},
    me: { id: 'me', name: 'You', bio: '', teach: [T('Guitar','advanced')], learn: [T('React','beginner'), T('Spanish','beginner')], avail: ['0-2','2-2','5-0'] },
    users: [
      { id:'priya', name:'Priya Nair', teach:[T('React','advanced'),T('JavaScript','advanced')], learn:[T('Guitar','beginner')], avail:['0-2','2-2','1-1'], rating:4.8, count:12, sessions:14 },
      { id:'marco', name:'Marco Rossi', teach:[T('Python','advanced')], learn:[T('Guitar','beginner')], avail:['1-2','5-0'], rating:4.5, count:6, sessions:7 },
      { id:'lena', name:'Lena Garcia', teach:[T('Spanish','advanced')], learn:[T('Python','beginner')], avail:['2-2','5-0','5-1'], rating:4.9, count:20, sessions:25 },
      { id:'sam', name:'Sam Carter', teach:[T('Photography','intermediate')], learn:[T('Cooking','beginner')], avail:['4-2'], rating:4.2, count:4, sessions:3 },
      { id:'aisha', name:'Aisha Khan', teach:[T('Cooking','advanced')], learn:[T('Photography','beginner')], avail:['4-2','4-1'], rating:4.7, count:9, sessions:11 },
    ] };
}
let S; try { S = JSON.parse(localStorage.getItem(KEY)); } catch {}
if (!S) S = fresh();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };

/* ---------- matching engine ---------- */
function teachable(teacher, learner) {
  return learner.learn.flatMap(w => { const t = teacher.teach.find(x => norm(x.s) === norm(w.s)); return t ? [{ s: t.s, tl: t.l, ll: w.l }] : []; });
}
function score(me, o) {
  const theyTeach = teachable(o, me), iTeach = teachable(me, o);
  if (!theyTeach.length && !iTeach.length) return null;
  const mutual = theyTeach.length > 0 && iTeach.length > 0;
  const hours = me.avail.filter(a => o.avail.includes(a)).length * SLOT_HOURS;
  const fit = theyTeach.reduce((n, m) => n + (LV[m.tl] > LV[m.ll] ? 5 : LV[m.tl] === LV[m.ll] ? 2 : 0), 0);
  const parts = { 'Mutual bonus': mutual ? 40 : 0, 'Skill overlap': Math.min(30, (theyTeach.length + iTeach.length) * 10), 'Rating': Math.min(20, o.rating * 4), 'Sessions': Math.min(10, o.sessions), 'Availability': Math.min(15, hours * 3), 'Level fit': Math.min(10, fit) };
  return { o, mutual, theyTeach, iTeach, hours, parts, score: Math.min(100, Math.round(Object.values(parts).reduce((a, b) => a + b, 0))) };
}
const matches = () => S.users.map(u => score(S.me, u)).filter(Boolean).sort((a, b) => (b.mutual - a.mutual) || (b.score - a.score));
function chains() {
  const mutualIds = new Set(S.users.filter(u => teachable(u, S.me).length && teachable(S.me, u).length).map(u => u.id)), out = [];
  for (const a of S.users) { const x = teachable(S.me, a); if (!x.length) continue;
    for (const b of S.users) { if (b.id === a.id || mutualIds.has(b.id)) continue;
      const y = teachable(a, b), z = teachable(b, S.me); if (y.length && z.length) out.push({ a, b, x: x[0].s, y: y[0].s, z: z[0].s }); } }
  return out.slice(0, 5);
}

/* ---------- ratings ---------- */
function rate(id, n) {
  const u = S.users.find(x => x.id === id), prev = S.myRatings[id];
  const total = u.rating * u.count - (prev || 0) + n; if (!prev) u.count++;
  u.rating = Math.round(total / u.count * 10) / 10; S.myRatings[id] = n;
}
const stars = (id, n) => `<span class="stars" role="group" aria-label="Rate ${esc(id)}">${[1,2,3,4,5].map(i => `<button class="${i <= n ? 'on' : ''}" data-act="rate" data-id="${id}" data-n="${i}" aria-label="${i} star${i > 1 ? 's' : ''}">★</button>`).join('')}</span>`;

/* ---------- chat (simulated real time) ---------- */
let typingWith = null;
function sendMsg(id, text) {
  (S.chats[id] ||= []).push({ f: 'me', t: text }); save(); typingWith = id; render();
  const u = S.users.find(x => x.id === id), shared = (teachable(u, S.me)[0] || teachable(S.me, u)[0] || {}).s || 'skills';
  const replies = [`Hi! Happy to swap ${shared} lessons. When are you free?`, `Sounds good, I can do the evening slots on my profile.`, `Great, let's book a session this week!`, `Thanks for reaching out, ${shared} is my favourite thing to teach.`];
  setTimeout(() => { (S.chats[id] ||= []).push({ f: id, t: replies[(S.chats[id].length >> 1) % replies.length] }); typingWith = null; save(); render(); }, 1300);
}

/* ---------- views ---------- */
const chip = (x, k) => `<span class="chip ${k}">${esc(x.s)} <span class="muted sm">${x.l}</span></span>`;
const avatar = n => `<div class="av" aria-hidden="true">${esc(n[0].toUpperCase())}</div>`;

function vMatches() {
  const ms = matches(), ch = chains();
  return `<h1>Your matches</h1><p class="muted">People who can teach what you want to learn. Mutual matches come first, then by score. Change your profile or rate someone and watch the ranking update.</p>
  ${ms.length ? '' : '<div class="card">No matches yet. Add skills on My profile.</div>'}
  ${ms.map(m => `<div class="card"><div class="row between"><div class="row">${avatar(m.o.name)}<div>
    <h3>${esc(m.o.name)} <span class="tag ${m.mutual ? 'm' : 'o'}">${m.mutual ? 'MUTUAL MATCH' : 'ONE-WAY'}</span></h3>
    <span class="muted sm">★ ${m.o.rating.toFixed(1)} (${m.o.count} ratings) · ${m.o.sessions} sessions</span></div></div>
    <div class="score" title="${Object.entries(m.parts).map(([k, v]) => k + ': ' + Math.round(v)).join(' | ')}">${m.score}<small>match score</small></div></div>
    <div style="margin-top:.7rem">${m.theyTeach.length ? `<p class="sm"><span class="muted">They can teach you:</span> ${m.theyTeach.map(t => chip({ s: t.s, l: t.tl }, 'l')).join('')}</p>` : ''}
    ${m.iTeach.length ? `<p class="sm"><span class="muted">You can teach them:</span> ${m.iTeach.map(t => chip({ s: t.s, l: t.ll }, 't')).join('')}</p>` : ''}
    <p class="sm muted">${m.hours ? m.hours + ' hours of shared weekly availability' : 'No shared availability yet'} · hover the score to see how it is calculated</p></div>
    <div class="row between"><button class="btn" data-act="msg" data-id="${m.o.id}">Message</button><span class="sm muted">Your rating: ${stars(m.o.id, S.myRatings[m.o.id] || 0)}</span></div></div>`).join('')}
  ${ch.length ? `<h2 style="margin-top:1.4rem">3-way skill chains</h2><p class="muted sm">No direct partner for a skill you want? These chains connect you through a middle person.</p>
  ${ch.map(c => `<div class="card chain"><span class="node">You</span><span class="arrow">teach ${esc(c.x)} →</span><span class="node">${esc(c.a.name)}</span><span class="arrow">teaches ${esc(c.y)} →</span><span class="node">${esc(c.b.name)}</span><span class="arrow">teaches ${esc(c.z)} →</span><span class="node">You</span></div>`).join('')}` : ''}`;
}

function skillBox(kind, title) {
  const list = S.me[kind], k = kind === 'teach' ? 't' : 'l';
  return `<div class="card"><h2>${title}</h2><div>${list.length ? list.map((x, i) => `<span class="chip ${k}">${esc(x.s)} <span class="muted sm">${x.l}</span><button data-act="rm" data-k="${kind}" data-i="${i}" aria-label="Remove ${esc(x.s)}">×</button></span>`).join('') : '<span class="muted sm">Nothing added yet.</span>'}</div>
  <div class="row" style="margin:.5rem 0"><input id="in-${kind}" placeholder="Add a skill" aria-label="${title} skill" style="flex:1;min-width:130px"><select id="lv-${kind}" aria-label="Level" style="width:auto">${Object.keys(LV).map(l => `<option>${l}</option>`).join('')}</select><button class="btn" data-act="add" data-k="${kind}">Add</button></div>
  <div class="sm muted">Quick add: ${QUICK.filter(q => !list.some(x => norm(x.s) === norm(q))).map(q => `<button class="chip add" data-act="quick" data-k="${kind}" data-s="${q}">+ ${q}</button>`).join('')}</div></div>`;
}
function vProfile() {
  return `<h1>My profile</h1><p class="muted">Matches use what you can teach, what you want to learn (with your current level) and when you are free.</p>
  <div class="card"><label>Name<input id="name" value="${esc(S.me.name)}"></label><label>About you<textarea id="bio" maxlength="300" rows="2">${esc(S.me.bio)}</textarea></label></div>
  <div class="two">${skillBox('teach', 'I can teach')}${skillBox('learn', 'I want to learn')}</div>
  <div class="card"><h2>Weekly availability</h2><p class="muted sm">Tap the times you are usually free. Each slot is ${SLOT_HOURS} hours.</p><div style="overflow-x:auto"><table><tr><th></th>${DAYS.map(d => `<th>${d}</th>`).join('')}</tr>
  ${SLOTS.map((s, si) => `<tr><th style="text-align:right;padding-right:.4rem">${s}</th>${DAYS.map((d, di) => `<td><button class="slot" data-act="slot" data-k="${di}-${si}" aria-pressed="${S.me.avail.includes(di + '-' + si)}" aria-label="${d} ${s}">${S.me.avail.includes(di + '-' + si) ? 'Free' : '–'}</button></td>`).join('')}</tr>`).join('')}</table></div></div>
  <div class="row"><button class="btn" data-act="saveprofile">Save profile</button><button class="btn g" data-act="reset">Reset demo data</button></div>`;
}

function vChat() {
  const id = S.chat, u = S.users.find(x => x.id === id), msgs = S.chats[id] || [];
  return `<h1>Chat</h1><div class="chat"><div class="card list" role="list" aria-label="People">${S.users.map(x => { const l = (S.chats[x.id] || []).slice(-1)[0]; return `<button class="who ${x.id === id ? 'on' : ''}" data-act="msg" data-id="${x.id}">${avatar(x.name)}<span style="min-width:0"><b>${esc(x.name)}</b><div class="sm muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${l ? esc(l.t) : 'Say hello'}</div></span></button>`; }).join('')}</div>
  <div class="card th">${u ? `<header><b>${esc(u.name)}</b> <span class="sm" style="color:var(--ok)">● Online</span></header>
  <div class="msgs" id="msgs" aria-live="polite">${msgs.length ? '' : '<p class="muted sm">No messages yet. Say hi and suggest a skill swap.</p>'}${msgs.map(m => `<div class="b ${m.f === 'me' ? 'me' : ''}">${esc(m.t)}</div>`).join('')}${typingWith === id ? `<div class="sm muted">${esc(u.name.split(' ')[0])} is typing...</div>` : ''}</div>
  <form class="cmp" id="cform"><input id="msg" placeholder="Type a message" aria-label="Message" autocomplete="off"><button class="btn">Send</button></form>` : '<p class="muted" style="padding:1rem">Choose someone to chat with.</p>'}</div></div>
  <p class="muted sm">Demo note: replies are simulated in this single-file version. The full SkillBridge project uses real Socket.IO for live two-way chat.</p>`;
}

function render() {
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-current', b.dataset.v === S.tab ? 'page' : 'false'));
  const old = $('#msg'), val = old ? old.value : '', had = old && document.activeElement === old;
  $('#app').innerHTML = S.tab === 'matches' ? vMatches() : S.tab === 'profile' ? vProfile() : vChat();
  const m = $('#msg'); if (m) { m.value = val; if (had) m.focus(); }
  const box = $('#msgs'); if (box) box.scrollTop = box.scrollHeight;
}

/* ---------- events ---------- */
function addSkill(k, s, l) {
  s = s.trim().slice(0, 40); if (!s || S.me[k].some(x => norm(x.s) === norm(s))) return;
  S.me[k].push(T(s, l)); save(); render();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return; const d = b.dataset;
  if (d.act === 'tab') S.tab = d.v;
  else if (d.act === 'theme') { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = t; b.textContent = t === 'dark' ? 'Light mode' : 'Dark mode'; try { localStorage.setItem(KEY + '_theme', t); } catch {} return; }
  else if (d.act === 'rate') rate(d.id, Number(d.n));
  else if (d.act === 'msg') { S.chat = d.id; S.tab = 'chat'; }
  else if (d.act === 'rm') { S.me[d.k].splice(Number(d.i), 1); }
  else if (d.act === 'add') { addSkill(d.k, $('#in-' + d.k).value, $('#lv-' + d.k).value); return; }
  else if (d.act === 'quick') { addSkill(d.k, d.s, 'beginner'); return; }
  else if (d.act === 'slot') { const a = S.me.avail, i = a.indexOf(d.k); i >= 0 ? a.splice(i, 1) : a.push(d.k); }
  else if (d.act === 'saveprofile') { S.me.name = $('#name').value.trim() || 'You'; S.me.bio = $('#bio').value; S.tab = 'matches'; }
  else if (d.act === 'reset') { if (!confirm('Reset all demo data?')) return; S = fresh(); }
  save(); render();
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id && e.target.id.startsWith('in-')) { e.preventDefault(); const k = e.target.id.slice(3); addSkill(k, e.target.value, $('#lv-' + k).value); } });
document.addEventListener('submit', e => { if (e.target.id !== 'cform') return; e.preventDefault(); const i = $('#msg'), t = i.value.trim(); if (!t) return; i.value = ''; sendMsg(S.chat, t); });

try { document.documentElement.dataset.theme = localStorage.getItem(KEY + '_theme') || 'dark'; } catch {}
document.querySelector('[data-act=theme]').textContent = document.documentElement.dataset.theme === 'dark' ? 'Light mode' : 'Dark mode';
render();
</script>
